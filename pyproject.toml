[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-webui"
version = "1.0.0"
description = "YouTube browser with integrated yt-dlp downloader — no Electron, no API keys"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ash96534", email = "ash96534@example.com" }]
license = { text = "MIT" }
keywords = ["youtube", "yt-dlp", "downloader", "desktop", "pyqt6", "ffmpeg"]

[project.dependencies]
yt-dlp >= "2026.8.0"
PyQt6 >= "6.12.0"
PyQt6-Qt6 >= "6.12.0"

[project.scripts]
yt-dlp-webui = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["yt_dlp_webui*"]

[tool.setuptools.package-data]
yt_dlp_webui = ["ffmpeg/bin/*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.black.line-length]
value = 88
