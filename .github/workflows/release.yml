name: Release

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp>=2026.8.0 PyQt6>=6.12.0 PyQt6-Qt6>=6.12.0 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Create zip archive
        run: |
          cd dist/yt-dlp-webui
          7z a ../yt-dlp-webui-windows-x86_64.zip *
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-windows-x86_64
          path: dist/yt-dlp-webui-windows-x86_64.zip

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp>=2026.8.0 PyQt6>=6.12.0 PyQt6-Qt6>=6.12.0 pyinstaller appimagetool

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender1 libfontconfig1

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Build AppImage
        run: |
          bash build-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-linux-x86_64
          path: dist/*.AppImage

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp>=2026.8.0 PyQt6>=6.12.0 PyQt6-Qt6>=6.12.0 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname "YT-DLP WebUI" -srcfolder dist/yt-dlp-webui -ov -format UDZO dist/YT-DLP-WebUI-1.0.0-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-macos
          path: dist/YT-DLP-WebUI-1.0.0-macOS.dmg

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          name: YT-DLP WebUI v1.0.0
          tag_name: v1.0.0
          draft: false
          prerelease: false
          body: |
            # YT-DLP WebUI v1.0.0

            ## What's New
            - Integrated Chromium YouTube browser
            - Download queue with pause/resume/retry/cancel
            - Built-in media player with speed controls
            - Music library with Artist Radio, Album Radio, Discovery Weekly
            - Mood-based playlists (Chill, Workout, Party, Focus, Sleep)
            - Multi-output audio (play to multiple devices simultaneously)
            - Download MP3s directly from YouTube
            - SQLite library with play count and watch history
            - System tray with now-playing tooltip
            - Auto-update yt-dlp
            - Export/import playlists (JSON)
            - Dark/Light/System themes

            ## Installation
            - **Windows**: Download `YT-DLP-WebUI-Setup-1.0.0.exe` or portable `.zip`
            - **Linux**: Download `.AppImage`
            - **macOS**: Download `.dmg`

            ## Quick Start
            1. Install and launch the app
            2. Search for a YouTube video or paste a URL
            3. Click "Download" to add to queue
            4. Play downloaded media from the Library tab

            ## Requirements
            - Windows 10/11, macOS 10.15+, or Linux
            - FFmpeg (bundled on Windows, install separately on macOS/Linux)

---

Your release notes above.
