name: Release

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp PyQt6==6.14.0 PyQt6-Qt6==6.14.0 PyQt6-WebEngine==6.14.0 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Create zip archive
        run: |
          cd dist/yt-dlp-webui
          7z a ../yt-dlp-webui-windows-x86_64.zip *
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-windows-x86_64
          path: dist/yt-dlp-webui-windows-x86_64.zip

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp PyQt6==6.14.0 PyQt6-Qt6==6.14.0 PyQt6-WebEngine==6.14.0 pyinstaller

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libfontconfig1

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Build AppImage
        run: |
          mkdir -p appdir/usr/bin
          cp dist/yt-dlp-webui/yt-dlp-webui appdir/usr/bin/
          chmod +x appdir/usr/bin/yt-dlp-webui
          cat > appdir/usr/share/applications/yt-dlp-webui.desktop << EOF
[Desktop Entry]
Name=YT-DLP WebUI
Comment=YouTube Browser with Integrated Downloader
Exec=yt-dlp-webui
Icon=yt-dlp-webui
Type=Application
Categories=AudioVideo;Network;
EOF
          cp ffmpeg/bin/ffmpeg "$APPDIR/usr/share/icons/hicolor/256x256/apps/yt-dlp-webui.png" 2>/dev/null || true
          cat > "$APPDIR/AppRun" << 'EOF'
#!/bin/bash
cd "$(dirname "$0")"
exec ./usr/bin/yt-dlp-webui "$@"
EOF
          chmod +x "$APPDIR/AppRun"
          ./appimagetool.AppImage appdir dist/YT-DLP-WebUI-1.0.4-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-linux-x86_64
          path: dist/YT-DLP-WebUI-1.0.4-x86_64.AppImage

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp PyQt6==6.14.0 PyQt6-Qt6==6.14.0 PyQt6-WebEngine==6.14.0 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname "YT-DLP WebUI" -srcfolder dist/yt-dlp-webui -ov -format UDZO dist/YT-DLP-WebUI-1.0.4-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-macos
          path: dist/YT-DLP-WebUI-1.0.4-macOS.dmg

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          name: YT-DLP WebUI v1.0.4
          tag_name: v1.0.4
          draft: false
          prerelease: false
          body: |
            # YT-DLP WebUI v1.0.4

            ## What's New
            - Integrated Chromium YouTube browser
            - Download queue with pause/resume/retry/cancel
            - Built-in media player with speed controls
            - Music library with Artist Radio, Album Radio, Discovery Weekly
            - Mood-based playlists (Chill, Workout, Party, Focus, Sleep)
            - Multi-output audio (play to multiple devices simultaneously)
            - Download MP3s directly from YouTube
            - SQLite library with play count and watch history
            - System tray with now-playing tooltip
            - Auto-update yt-dlp
            - Export/import playlists (JSON)

            ## Installation
            - **Windows**: Download `YT-DLP-WebUI-Setup-1.0.4.exe` or portable `.zip`
            - **Linux**: Download `.AppImage`
            - **macOS**: Download `.dmg`

            ## Quick Start
            1. Install and launch the app
            2. Search for a YouTube video or paste a URL
            3. Click "Add to queue" to download
            4. Play downloaded media from the Library tab

            ## Requirements
            - Windows 10/11, macOS 10.15+, or Linux
            - FFmpeg (required for audio extraction and metadata embedding; install separately)
---