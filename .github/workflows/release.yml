name: Release

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp>=2026.8.0 PyQt6>=6.12.0 PyQt6-Qt6>=6.12.0 PyQt6-WebEngine>=6.12.0 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Create zip archive
        run: |
          cd dist/yt-dlp-webui
          7z a ../yt-dlp-webui-windows-x86_64.zip *
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-windows-x86_64
          path: dist/yt-dlp-webui-windows-x86_64.zip

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp>=2026.8.0 PyQt6>=6.12.0 PyQt6-Qt6>=6.12.0 PyQt6-WebEngine>=6.12.0 pyinstaller

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libfontconfig1

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          mkdir -p appdir/usr/bin
          cp dist/yt-dlp-webui/yt-dlp-webui appdir/usr/bin/
          chmod +x appdir/usr/bin/yt-dlp-webui
          ./appimagetool.AppImage appdir dist/YT-DLP-WebUI-1.0.4-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-linux-x86_64
          path: dist/YT-DLP-WebUI-1.0.4-x86_64.AppImage

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp>=2026.8.0 PyQt6>=6.12.0 PyQt6-Qt6>=6.12.0 PyQt6-WebEngine>=6.12.0 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller yt-dlp-webui.spec --clean --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname "YT-DLP WebUI" -srcfolder dist/yt-dlp-webui -ov -format UDZO dist/YT-DLP-WebUI-1.0.4-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-macos
          path: dist/YT-DLP-WebUI-1.0.4-macOS.dmg

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          name: YT-DLP WebUI v1.0.4
          tag_name: v1.0.4
          draft: false
          prerelease: false
          body: |
            # YT-DLP WebUI v1.0.4

            ## What's New
            - Fixed CI build: add PyQt6-WebEngine dependency
            - Fixed spec file for cross-platform compatibility
            - Fixed FFmpeg download URLs for all platforms

            ## Installation
            - **Windows**: Download `YT-DLP-WebUI-Setup-1.0.4.exe` or portable `.zip`
            - **Linux**: Download `.AppImage`
            - **macOS**: Download `.dmg`

            ## Quick Start
            1. Install and launch the app
            2. Search for a YouTube video or paste a URL
            3. Click "Add to queue" to download
            4. Play downloaded media from the Library tab

            ## Requirements
            - Windows 10/11, macOS 10.15+, or Linux
            - FFmpeg (required for audio extraction and metadata embedding; install separately)

---